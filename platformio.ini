; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
; SinricPro 5.x exige Arduino core 3.x. A plataforma oficial "espressif32"
; ainda traz o core 2.x, por isso usamos a pioarduino (mesma do exemplo
; oficial da Sinric).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
upload_speed = 115200
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
; Lê o .env e repassa as credenciais como macros de compilação.
extra_scripts = pre:scripts/carregar_env.py
build_flags =
	-D NODEBUG_WEBSOCKETS
	-D NODEBUG_SINRIC
lib_deps = 
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit SSD1306@^2.5.9
	adafruit/Adafruit GFX Library@^1.11.9
	sinricpro/SinricPro@^5.1.0
